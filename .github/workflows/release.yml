name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release from
        required: true
        default: main
        type: string
      tag:
        description: Tag name to create (e.g., v1.0.0)
        required: true
        type: string
      release_name:
        description: Optional release title (defaults to tag)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build backend release jar
        run: ./gradlew :backend:runnerJar

      - name: Package release artifacts
        run: |
          mkdir -p release-artifacts
          mapfile -t runner_jars < <(find backend/build/libs -maxdepth 1 -name "*-runner.jar" -type f)
          if [ "${#runner_jars[@]}" -ne 1 ]; then
            echo "Expected exactly one runner jar, found ${#runner_jars[@]}"
            printf '%s\n' "${runner_jars[@]}"
            exit 1
          fi
          cp "${runner_jars[0]}" release-artifacts/
          cd frontend/dist
          zip -r ../../release-artifacts/frontend-dist.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.branch }}
          name: ${{ inputs.release_name || inputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/*
